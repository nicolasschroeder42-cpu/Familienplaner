<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Familienplaner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --a:#6366f1; --b:#f97316;
  --bg:#f6f5fb; --card:#ffffff; --card2:#f0eff7; --text:#1d1b2c; --muted:#6e6a85; --line:#e4e2ef;
  --shadow:0 1px 2px rgba(30,25,70,.05),0 6px 20px rgba(30,25,70,.06);
  --radius:18px;
  color-scheme:light;
}
/* Dunkel: automatisch nach Geräte-Einstellung oder fest gewählt (data-theme) */
:root[data-theme=dark]{--bg:#121218;--card:#1d1d26;--card2:#262633;--text:#ecebf5;--muted:#9a97b0;--line:#2e2e3c;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#121218;--card:#1d1d26;--card2:#262633;--text:#ecebf5;--muted:#9a97b0;--line:#2e2e3c;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.4;min-height:100vh;padding-bottom:100px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- Kopfbereich ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:40px;height:40px;border-radius:12px;display:block;flex:none}
.brand h1{font-size:18px;margin:0;letter-spacing:-.3px}
.brand small{color:var(--muted);font-size:13px}
.tabs{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:2px}
.tabs button{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.tabs button svg{width:18px;height:18px}
.tabs button.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--card2)}
.icon-btn svg{width:20px;height:20px}

.toolbar{max-width:1240px;margin:0 auto;padding:16px 16px 4px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .lbl{font-size:20px;font-weight:700;letter-spacing:-.3px;min-width:0;padding:0 6px}
.round{width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.round svg{width:18px;height:18px}
.pill-btn{padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600}
.filter{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.filter button{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.filter button.active{color:var(--text);border-color:var(--text)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.a{background:var(--a)}.dot.b{background:var(--b)}.dot.both{background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%)}

main{max-width:1240px;margin:0 auto;padding:12px 16px}

/* ---------- Personenfarben ---------- */
.who-a{--grad:linear-gradient(135deg,var(--a),var(--a));--solid:var(--a);--tint:color-mix(in srgb,var(--a) 11%,var(--card))}
.who-b{--grad:linear-gradient(135deg,var(--b),var(--b));--solid:var(--b);--tint:color-mix(in srgb,var(--b) 11%,var(--card))}
.who-both{--grad:linear-gradient(135deg,var(--a),var(--b));--solid:var(--a);--tint:linear-gradient(90deg,color-mix(in srgb,var(--a) 11%,var(--card)),color-mix(in srgb,var(--b) 11%,var(--card)))}

/* ---------- Karten / Sektionen ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.section{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.section h3{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.section .count{font-size:13px;color:var(--muted)}
.section.warn h3{color:#dc2626}
.list{display:flex;flex-direction:column;gap:8px}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--card);border-radius:var(--radius);border:1.5px dashed var(--line)}
.empty .big{font-size:34px;display:block;margin-bottom:6px}

/* ---------- Aufgaben-Eintrag ---------- */
.item{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-radius:16px;background:var(--tint);overflow:hidden;transition:transform .15s,opacity .2s}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--grad)}
.item:active{transform:scale(.99)}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--grad) border-box;color:transparent;display:grid;place-items:center;transition:all .2s}
.check svg{width:18px;height:18px}
.item.done .check,.chip.done .check{background:var(--grad) border-box;color:#fff}
.item-body{flex:1;min-width:0;cursor:pointer}
.item-title{font-weight:650;font-size:16px}
.item-desc{color:var(--muted);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.item.done .item-title{text-decoration:line-through;opacity:.5}
.item.done .item-desc,.item.done .item-meta{opacity:.5}
.avatar{flex:none;width:32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;letter-spacing:-.5px}
.override-mark{font-size:11px;color:var(--muted)}

/* ---------- Tag: Fortschritt ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero h2{margin:0;font-size:24px;letter-spacing:-.4px}
.hero p{margin:4px 0 0;color:var(--muted)}
.rings{display:flex;gap:18px}
.ring{display:flex;align-items:center;gap:10px}
.ring svg{width:58px;height:58px;transform:rotate(-90deg)}
.ring .txt b{display:block;font-size:15px}
.ring .txt span{font-size:13px;color:var(--muted)}
.cols2{display:grid;grid-template-columns:1fr;gap:0 24px}
.cols2>div{min-width:0}
@media (min-width:900px){.cols2{grid-template-columns:3fr 2fr}}

/* ---------- Woche ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:10px 8px;min-height:180px;display:flex;flex-direction:column;gap:6px}
.wday.today{outline:2.5px solid var(--text);outline-offset:-2.5px}
.wday-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 4px;cursor:pointer}
.wday-head b{font-size:15px}.wday-head span{font-size:13px;color:var(--muted)}
.chip{position:relative;display:flex;align-items:flex-start;gap:7px;padding:7px 8px 7px 10px;border-radius:11px;background:var(--tint);font-size:13.5px;overflow:hidden}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad)}
.chip .check{width:22px;height:22px;border-width:2px}
.chip .check svg{width:13px;height:13px}
.chip .item-body{font-weight:600;line-height:1.25;padding-top:2px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.chip.done .item-body{text-decoration:line-through;opacity:.5}
.flexrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
@media (max-width:760px){
  .week{grid-template-columns:1fr}
  .wday{min-height:0}
}

/* ---------- Monat ---------- */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mhead{text-align:center;font-size:13px;font-weight:700;color:var(--muted);padding:4px 0}
.mcell{background:var(--card);border-radius:12px;min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;box-shadow:var(--shadow);overflow:hidden}
.mcell.out{opacity:.4}
.mcell.today{outline:2.5px solid var(--text);outline-offset:-2.5px}
.mcell .num{font-size:13px;font-weight:700;padding:0 2px 2px;display:flex;justify-content:space-between}
.mcell .num small{font-weight:600;color:var(--muted)}
.mbar{font-size:11.5px;padding:2px 6px;border-radius:6px;background:var(--tint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--solid)}
.mbar.done{text-decoration:line-through;opacity:.5}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.mdots{display:none;gap:3px;flex-wrap:wrap;padding:2px}
@media (max-width:700px){
  .mcell{min-height:64px}
  .mbar,.more{display:none}
  .mdots{display:flex}
}

/* ---------- Aufgabenliste ---------- */
.trow{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 20px;border-radius:16px;background:var(--tint);position:relative;overflow:hidden;cursor:pointer}
.trow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--grad)}
.trow .ic{font-size:22px}
.trow .main{flex:1;min-width:0}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--card);color:var(--muted);font-weight:600}
.summary{display:flex;gap:12px;flex-wrap:wrap}
.summary .card{flex:1;min-width:180px;display:flex;align-items:center;gap:12px;padding:14px 16px}
.summary .num{font-size:26px;font-weight:800;letter-spacing:-.5px}

/* ---------- Balance ---------- */
.bal-split{display:flex;height:46px;border-radius:14px;overflow:hidden;margin:14px 0 8px;background:var(--card2)}
.bal-split div{display:flex;align-items:center;padding:0 14px;color:#fff;font-weight:700;font-size:15px;white-space:nowrap;transition:width .4s}
.bal-a{background:var(--a)}.bal-b{background:var(--b);justify-content:flex-end}
.verdict{font-size:15px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .row{display:flex;justify-content:space-between;font-size:14px}
.stat .row span{color:var(--muted)}
.catrow{display:grid;grid-template-columns:160px 1fr 90px;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.catrow:last-child{border:0}
.catbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--card2)}
.catbar i{display:block}
.catrow .mins{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:600px){.catrow{grid-template-columns:110px 1fr 70px}}
.seg-switch{display:inline-flex;background:var(--card2);border-radius:12px;padding:3px}
.seg-switch button{padding:6px 14px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg-switch button.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* ---------- FAB ---------- */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));z-index:30;height:60px;padding:0 24px 0 20px;border-radius:30px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px color-mix(in srgb,var(--a) 40%,transparent)}
.fab svg{width:24px;height:24px}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,12,35,.45);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.sheet{background:var(--card);border-radius:24px;width:100%;max-width:620px;max-height:calc(100vh - 32px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .2s}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translateY(16px) scale(.98);opacity:0}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:21px;letter-spacing:-.3px}
.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}
.field>span{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.field em{font-style:normal;font-weight:500;text-transform:none;letter-spacing:0}
.field input[type=text],.field input:not([type]),.field input[type=date],.field input[type=number],.field textarea,.field select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--a)}
.field small{color:var(--muted);font-size:12.5px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:14.5px;font-weight:600;cursor:pointer;user-select:none}
.opt input:checked+span{border-color:var(--text);background:var(--card);box-shadow:var(--shadow)}
.opt.who input:checked+span{border-color:transparent;background:var(--grad);color:#fff}
.wd .opt span{width:46px;justify-content:center;padding:9px 0}
.inline{display:flex;align-items:center;gap:10px}
.inline input{width:90px!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.btn{padding:12px 20px;border-radius:12px;font-weight:700;background:var(--card2)}
.btn.primary{background:var(--text);color:var(--bg)}
.btn.danger{color:#dc2626;margin-right:auto}
.hint{background:var(--card2);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--muted);margin-top:8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches .opt span{width:36px;height:36px;padding:0;border-radius:50%;border:3px solid transparent}
.swatches .opt input:checked+span{border-color:var(--text);box-shadow:inset 0 0 0 3px var(--card)}
.det-desc{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px 14px;margin:10px 0}

/* ---------- Sync ---------- */
.sync-ind{position:relative;display:grid;cursor:default}
.sync-ind:hover{background:none}
.sdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;background:#9ca3af}
.sdot.online{background:#10b981}.sdot.offline{background:#f59e0b}.sdot.connecting{background:#60a5fa}.sdot.error{background:#dc2626}
.sync-ind .sdot{position:absolute;right:5px;bottom:6px;border:2px solid var(--bg);width:12px;height:12px}
.syncbox{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:10px}
.qr{display:grid;place-items:center;background:#fff;border-radius:16px;padding:14px;margin:12px auto;width:fit-content}
.qr svg,.qr img{width:240px;height:240px;display:block}
.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
.actions.start{justify-content:flex-start;margin-top:0}
.muted{color:var(--muted);font-size:14px;margin:0 0 10px}

.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{max-width:1240px;margin:12px auto 0;padding:10px 16px;background:#fef3c7;color:#92400e;border-radius:12px;font-size:14px}

/* ---------- Pausen, Eingang, Logbuch, Anfragen ---------- */
.pause-banner{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:16px;background:color-mix(in srgb,#0ea5e9 14%,var(--card));margin-top:12px;font-weight:600}
.pause-banner small{display:block;font-weight:500;color:var(--muted)}
.prow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);cursor:pointer}
.prow .main{flex:1;min-width:0}
.prow .main small{display:block;color:var(--muted);font-size:13px}
.prow .ic{font-size:22px}
.req{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:14px 16px;border-radius:16px;background:color-mix(in srgb,#f59e0b 16%,var(--card));margin-top:12px}
.req .txt{flex:1;min-width:200px;font-weight:600}
.req .txt small{display:block;font-weight:500;color:var(--muted)}
.req .btn{padding:9px 16px}
.inbox-add{display:flex;gap:8px}
.inbox-add input{flex:1;min-width:0;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:16px;outline:none}
.inbox-add input:focus{border-color:var(--a)}
.note{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);flex-wrap:wrap}
.note .main{flex:1;min-width:180px;white-space:pre-wrap;overflow-wrap:anywhere}
.note .main small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px;white-space:normal}
.note .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mini{padding:7px 12px;border-radius:10px;font-weight:700;font-size:13.5px;background:var(--card2)}
.mini.primary{background:var(--text);color:var(--bg)}
.tabs button{position:relative}
.tab-badge{position:absolute;top:1px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:#ef4444;color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
.log{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;border-left:5px solid var(--st)}
.log .ic{font-size:26px}
.log .main{flex:1;min-width:0}
.log .main b{font-size:16px}
.log .main small{display:block;color:var(--muted);font-size:13px}
.st-pill{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--st) 16%,var(--card));color:var(--st);white-space:nowrap}
.st-over{--st:#dc2626}.st-soon{--st:#d97706}.st-ok{--st:#10b981}.st-none{--st:#9ca3af}
.fab2{position:fixed;right:max(26px,calc(env(safe-area-inset-right) + 6px));bottom:max(96px,calc(env(safe-area-inset-bottom) + 72px));z-index:30;width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:var(--shadow),0 4px 14px rgba(0,0,0,.14);font-size:22px;display:grid;place-items:center}

/* ---------- Kühlschrank-Modus (pro Gerät) ---------- */
body.kiosk{padding-bottom:20px}
body.kiosk .top,body.kiosk #toolbar,body.kiosk .fab,body.kiosk .fab2{display:none}
body.kiosk main{max-width:none;padding:18px 24px}
.k-head{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.k-time{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.k-date{font-size:22px;color:var(--muted);font-weight:600}
.k-info{flex:1;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.k-pill{padding:10px 18px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:16px}
.k-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}
.k-col{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.k-col-head{display:flex;align-items:center;gap:12px}
.k-col-head .avatar{width:46px;height:46px;font-size:19px}
.k-col-head b{font-size:23px}
.k-col-head small{display:block;color:var(--muted);font-size:15px}

<script>
'use strict';
/* =========================================================
   Konstanten & Hilfsfunktionen
   ========================================================= */
const KEY = 'wirzwei.v1';
const UIKEY = 'wirzwei.ui';
/* @core-start – dieser und der zweite markierte Abschnitt werden auch vom Benachrichtigungs-Skript (push-senden.js) genutzt */
const VAPID_PUBLIC = 'BFgkpnjJk7CizgTOeD_9mGuPMLNyRVSy5MrTbA5Az0-IimqzsKBFKTrOgvREnK5GKK-WcaoXiOGoCDgE4wDsJU0';
const WD = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const WD_LONG = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const COLORS = ['#6366f1','#8b5cf6','#ec4899','#f43f5e','#f97316','#f59e0b','#10b981','#14b8a6','#0ea5e9','#64748b'];
const CATS = [
  {id:'haushalt',   name:'Haushalt',        icon:'🧹'},
  {id:'kinder',     name:'Jorik',           icon:'🧸'},
  {id:'essen',      name:'Einkaufen',       icon:'🛒'},
  {id:'kochen',     name:'Kochen',          icon:'🍳'},
  {id:'tiere',      name:'Pax&Rhonna',      icon:'🐈'},
  {id:'pferde',     name:'Pferde',          icon:'🐎'},
  {id:'muell',      name:'Müll',            icon:'🗑️'},
  {id:'orga',       name:'Organisation',    icon:'🗂️'},
  {id:'termine',    name:'Termine',         icon:'📅'},
  {id:'finanzen',   name:'Finanzen',        icon:'💶'},
  {id:'gesundheit', name:'Gesundheit',      icon:'🩺'},
  {id:'garten',     name:'Garten',          icon:'🌱'},
  {id:'sonstiges',  name:'Sonstiges',       icon:'✨'},
];
const FREQS = [
  {id:'daily',     name:'Täglich'},
  {id:'weekdays',  name:'Werktags'},
  {id:'weekly',    name:'Wöchentlich'},
  {id:'weekflex',  name:'1× pro Woche (flexibel)'},
  {id:'monthly',   name:'Monatlich'},
  {id:'monthflex', name:'1× pro Monat (flexibel)'},
  {id:'yearly',    name:'Jährlich'},
  {id:'once',      name:'Einmalig'},
];
const ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
const ICON_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';

const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const addMonths = (s,n) => { const d = parse(s); return iso(new Date(d.getFullYear(), d.getMonth()+n, 1)); };
const daysBetween = (a,b) => Math.round((parse(b) - parse(a)) / 864e5);
const dow = s => (parse(s).getDay() + 6) % 7;            // 0 = Montag
const monday = s => addDays(s, -dow(s));
const monthsBetween = (a,b) => { const A = parse(a), B = parse(b); return (B.getFullYear()-A.getFullYear())*12 + B.getMonth()-A.getMonth(); };
const daysInMonth = (y,m) => new Date(y, m+1, 0).getDate();
const mod = (a,n) => ((a % n) + n) % n;
const today = () => iso(new Date());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (s, o) => parse(s).toLocaleDateString('de-DE', o);
const fmtShort = s => fmt(s, {day:'numeric', month:'short'});
const fmtLong = s => fmt(s, {weekday:'long', day:'numeric', month:'long'});
const cat = id => CATS.find(c => c.id === id) || CATS[CATS.length-1];
const isoWeek = s => { const d = parse(s); d.setDate(d.getDate() + 3 - ((d.getDay()+6)%7)); const w1 = new Date(d.getFullYear(),0,4); return 1 + Math.round(((d - w1)/864e5 - 3 + ((w1.getDay()+6)%7)) / 7); };
const fmtMins = m => m >= 60 ? `${Math.floor(m/60)} h${m%60 ? ' ' + (m%60) + ' min' : ''}` : `${m} min`;
/* @core-end */

/* =========================================================
   Zustand & Speicherung
   ========================================================= */
let storageOK = true;
try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); } catch(e) { storageOK = false; }

function defaultState(){
  return {
    version: 1,
    setupDone: false,
    people: { a:{name:'Ich', color:'#6366f1'}, b:{name:'Partnerin', color:'#f97316'} },
    tasks: [],        // Aufgaben (Versionen; gleiche sid = gleiche Serie)
    done: {},         // key -> {at}
    overrides: {},    // key -> 'a' | 'b' | 'both'  (Zuständigkeit für einen einzelnen Termin)
    moves: {},        // key -> 'YYYY-MM-DD'      (einzelner Termin auf einen anderen Tag verschoben)
    pauses: {},       // id -> {label, from, to, scope:'all'|'some', sids:[]}   (Urlaub / Pause)
    inbox: {},        // id -> {text, by, at}                                    (Kopf leeren)
    requests: {},     // id -> {key, sid, orig, date, title, from, to, status, at, …} (Tausch-Anfragen)
    health: {},       // id -> {subject, title, last, every, unit, next, notes, history:[]} (Logbuch)
  };
}
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(defaultState(), JSON.parse(raw)); } catch(e) {}
  return defaultState();
}
let state = load();
let ui = Object.assign({view:'day', filter:'all', balRange:'week', theme:'auto', me:'', kiosk:false}, (() => { try { return JSON.parse(localStorage.getItem(UIKEY)) || {}; } catch(e) { return {}; } })());
ui.cursor = today();

function saveLocal(){
  if (!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e) { showBanner('Speichern fehlgeschlagen. Bitte unter Einstellungen ein Backup exportieren.'); }
}
function save(){ saveLocal(); pushSync(); }
function saveUI(){ try { localStorage.setItem(UIKEY, JSON.stringify({view:ui.view, filter:ui.filter, balRange:ui.balRange, theme:ui.theme, me:ui.me, kiosk:ui.kiosk})); } catch(e) {} }

// Darstellung (pro Gerät): auto | light | dark
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){
  const root = document.documentElement;
  if (ui.theme === 'auto') root.removeAttribute('data-theme'); else root.dataset.theme = ui.theme;
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(root).getPropertyValue('--bg').trim();
}
darkQuery.addEventListener?.('change', applyTheme);
applyTheme();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

const P = k => state.people[k];
const whoName = w => w === 'both' ? 'Beide' : w === 'alt' ? 'Abwechselnd' : P(w).name;
const initials = w => w === 'both' ? '∞' : (P(w).name.trim()[0] || '?').toUpperCase();

/* =========================================================
   Wiederholungslogik
   ========================================================= */
/* @core-start */
const DAY_TYPES = ['once','daily','weekdays','weekly','monthly','yearly'];

function active(t, from, to){ return t.start <= to && (!t.end || t.end >= from); }

function occursOn(t, d){
  if (!active(t, d, d)) return false;
  const f = t.freq, n = f.every || 1;
  switch (f.type){
    case 'once':     return d === f.date;
    case 'daily':    return mod(daysBetween(t.origin, d), n) === 0;
    case 'weekdays': return dow(d) < 5;
    case 'weekly':   return f.days.includes(dow(d)) && mod(daysBetween(monday(t.origin), monday(d))/7, n) === 0;
    case 'monthly': {
      const D = parse(d), target = Math.min(f.dom, daysInMonth(D.getFullYear(), D.getMonth()));
      return D.getDate() === target && mod(monthsBetween(t.origin, d), n) === 0;
    }
    case 'yearly':   return d.slice(5) === f.date.slice(5) && d >= f.date;
  }
  return false;
}

function periodIndex(t, d){
  const f = t.freq, n = f.every || 1;
  switch (f.type){
    case 'daily': case 'weekdays': return Math.floor(daysBetween(t.origin, d) / n);
    case 'weekly': case 'weekflex': return Math.floor(daysBetween(monday(t.origin), monday(d)) / 7 / n);
    case 'monthly': case 'monthflex': return Math.floor(monthsBetween(t.origin, d) / n);
    case 'yearly': return parse(d).getFullYear() - parse(t.origin).getFullYear();
  }
  return 0;
}

function makeInst(t, key, d){
  let who = state.overrides[key];
  const overridden = !!who;
  if (!who) who = t.assignee === 'alt' ? (mod(periodIndex(t, d), 2) === 0 ? (t.altStart || 'a') : (t.altStart === 'b' ? 'a' : 'b')) : t.assignee;
  return { task:t, key, date:d, who, overridden, done: !!state.done[key] };
}

// Urlaub / Pause: betrifft nur wiederkehrende Aufgaben – einmalige und jährliche Termine bleiben bestehen
const PAUSABLE = ['daily','weekdays','weekly','monthly','weekflex','monthflex'];
const activePauses = d => Object.values(state.pauses || {}).filter(p => p && p.from <= d && d <= p.to);
function pauseFor(t, d){
  if (!PAUSABLE.includes(t.freq.type)) return null;
  return activePauses(d).find(p => p.scope !== 'some' || (p.sids || []).includes(t.sid)) || null;
}
function pausedDays(t, from, n){
  let c = 0;
  for (let k = 0; k < n; k++) if (pauseFor(t, addDays(from, k))) c++;
  return c;
}

function dayInsts(d){
  const moves = state.moves || {};
  const own = state.tasks.filter(t => DAY_TYPES.includes(t.freq.type) && occursOn(t, d) && !pauseFor(t, d))
    .map(t => makeInst(t, `${t.sid}|${d}`, d))
    .filter(i => !moves[i.key]);
  // Termine, die von einem anderen Tag hierher verschoben wurden (Schlüssel bleibt der ursprüngliche)
  const movedIn = Object.keys(moves).filter(k => moves[k] === d).map(k => {
    const [sid, from] = k.split('|');
    const t = state.tasks.find(x => x.sid === sid && DAY_TYPES.includes(x.freq.type) && occursOn(x, from));
    return t && Object.assign(makeInst(t, k, from), {date: d, movedFrom: from});
  }).filter(Boolean);
  return own.concat(movedIn);
}
// Wird eine Serie mitten in der Woche/im Monat geändert, gilt für diesen Zeitraum die neuere Version
function latestPerSeries(list){
  const m = new Map();
  list.forEach(t => { if (!m.has(t.sid) || m.get(t.sid).start < t.start) m.set(t.sid, t); });
  return [...m.values()];
}
function weekFlexInsts(mon){
  const sun = addDays(mon, 6);
  return latestPerSeries(state.tasks.filter(t => t.freq.type === 'weekflex' && active(t, mon, sun)
      && mod(daysBetween(monday(t.origin), mon)/7, t.freq.every || 1) === 0))
    .filter(t => pausedDays(t, mon, 7) < 4)   // pausiert, wenn die Pause den Großteil der Woche abdeckt
    .map(t => makeInst(t, `${t.sid}|W${mon}`, mon));
}
function monthFlexInsts(anyDay){
  const D = parse(anyDay), first = iso(new Date(D.getFullYear(), D.getMonth(), 1)), last = iso(new Date(D.getFullYear(), D.getMonth()+1, 0));
  const nDays = daysInMonth(D.getFullYear(), D.getMonth());
  return latestPerSeries(state.tasks.filter(t => t.freq.type === 'monthflex' && active(t, first, last)
      && mod(monthsBetween(t.origin, first), t.freq.every || 1) === 0))
    .filter(t => pausedDays(t, first, nDays) * 2 < nDays)   // pausiert, wenn die Pause den Großteil des Monats abdeckt
    .map(t => makeInst(t, `${t.sid}|M${first.slice(0,7)}`, first));
}
function overdueInsts(){
  const td = today();
  return state.tasks.filter(t => t.freq.type === 'once' && !t.end && t.freq.date < td && t.freq.date >= t.start && !state.done[`${t.sid}|${t.freq.date}`])
    .map(t => makeInst(t, `${t.sid}|${t.freq.date}`, t.freq.date));
}

const matchesFilter = i => ui.filter === 'all' || i.who === ui.filter || i.who === 'both';
const sortInsts = arr => arr.sort((x,y) => (x.done - y.done) || ({a:0,b:1,both:2}[x.who] - {a:0,b:1,both:2}[y.who]) || x.task.title.localeCompare(y.task.title, 'de'));

function freqText(t){
  const f = t.freq, n = f.every || 1;
  switch (f.type){
    case 'once':      return `Einmalig · ${fmtShort(f.date)}`;
    case 'daily':     return n > 1 ? `Alle ${n} Tage` : 'Täglich';
    case 'weekdays':  return 'Werktags (Mo–Fr)';
    case 'weekly':    return `${n > 1 ? `Alle ${n} Wochen` : 'Wöchentlich'} · ${[...f.days].sort().map(d => WD[d]).join(', ')}`;
    case 'weekflex':  return n > 1 ? `1× alle ${n} Wochen` : '1× pro Woche';
    case 'monthly':   return `${n > 1 ? `Alle ${n} Monate` : 'Monatlich'} · am ${f.dom}.`;
    case 'monthflex': return n > 1 ? `1× alle ${n} Monate` : '1× pro Monat';
    case 'yearly':    return `Jährlich · ${fmt(f.date, {day:'numeric', month:'long'})}`;
  }
  return '';
}

// Text der Morgen-Benachrichtigung für Person p ('a' | 'b') am Tag d
// null = heute keine Nachricht (Pause für alle Aufgaben)
function buildDigest(p, d){
  if (activePauses(d).some(x => x.scope !== 'some')) return null;
  const mine = i => (i.who === p || i.who === 'both') && !i.done;
  const day = sortInsts(dayInsts(d).filter(mine));
  const over = overdueInsts().filter(mine);
  const week = weekFlexInsts(monday(d)).filter(mine);
  const list = arr => arr.slice(0, 4).map(i => i.task.title).join(', ') + (arr.length > 4 ? ' …' : '');
  const name = state.people?.[p]?.name || '';
  const parts = [day.length ? `Heute ${day.length === 1 ? '1 Aufgabe' : day.length + ' Aufgaben'}: ${list(day)}` : 'Heute steht nichts Festes für dich an. 🌿'];
  if (over.length) parts.push(`⚠️ Überfällig: ${list(over)}`);
  if (week.length) parts.push(`Diese Woche noch offen: ${list(week)}`);
  const due = Object.values(state.health || {}).filter(h => h && h.next && h.next <= d);
  if (due.length) parts.push(`🩺 Fällig: ${due.slice(0, 3).map(h => `${h.title} (${h.subject})`).join(', ')}${due.length > 3 ? ' …' : ''}`);
  return {title: `Guten Morgen${name ? ', ' + name : ''}! ☀️`, body: parts.join('\n')};
}
/* @core-end */

/* =========================================================
   Rendering
   ========================================================= */
const $ = s => document.querySelector(s);
let instIndex = new Map();

function applyColors(){
  document.documentElement.style.setProperty('--a', P('a').color);
  document.documentElement.style.setProperty('--b', P('b').color);
}

const VIEWS = {day:renderDay, week:renderWeek, month:renderMonth, tasks:renderTasks, inbox:renderInbox, log:renderLog, balance:renderBalance};
function render(){
  applyColors();
  instIndex = new Map();
  if (!VIEWS[ui.view]) ui.view = 'day';
  document.body.classList.toggle('kiosk', !!ui.kiosk);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === ui.view));
  $('#subtitle').textContent = `${P('a').name} & ${P('b').name}`;
  const n = Object.keys(state.inbox || {}).length, badge = $('#inboxBadge');
  badge.hidden = !n; badge.textContent = n;
  const v = $('#view');
  if (ui.kiosk){ $('#toolbar').innerHTML = ''; return renderKiosk(v); }
  renderToolbar();
  VIEWS[ui.view](v);
}

function filterHTML(){
  const b = (k, label, dot) => `<button class="${ui.filter === k ? 'active' : ''}" data-action="filter" data-f="${k}">${dot ? `<span class="dot ${k}"></span>` : ''}${esc(label)}</button>`;
  return `<div class="filter">${b('all','Alle', false)}${b('a', P('a').name, true)}${b('b', P('b').name, true)}</div>`;
}

function renderToolbar(){
  const c = ui.cursor, td = today();
  let label = '', isNow = false;
  if (ui.view === 'day'){
    label = c === td ? 'Heute' : c === addDays(td,1) ? 'Morgen' : c === addDays(td,-1) ? 'Gestern' : fmt(c, {weekday:'short', day:'numeric', month:'short'});
    isNow = c === td;
  } else if (ui.view === 'week' || (ui.view === 'balance' && ui.balRange === 'week')){
    const m = monday(c);
    label = `KW ${isoWeek(m)} · ${fmtShort(m)} – ${fmtShort(addDays(m,6))}`;
    isNow = m === monday(td);
  } else if (ui.view === 'month' || ui.view === 'balance'){
    label = fmt(c, {month:'long', year:'numeric'});
    isNow = c.slice(0,7) === td.slice(0,7);
  }
  const nav = label ? `<div class="datenav">
      <button class="round" data-action="prev" aria-label="zurück">${ICON_L}</button>
      <button class="round" data-action="next" aria-label="vor">${ICON_R}</button>
      <span class="lbl">${esc(label)}</span>
      ${isNow ? '' : '<button class="pill-btn" data-action="now">Heute</button>'}
    </div>` : `<div class="datenav"><span class="lbl">${({tasks:'Alle Aufgaben', inbox:'💭 Eingang', log:'🩺 Logbuch'})[ui.view]}</span></div>`;
  $('#toolbar').innerHTML = nav + (['balance','inbox','log'].includes(ui.view) ? '' : filterHTML());
}

function itemHTML(i, opts = {}){
  instIndex.set(i.key, i);
  const t = i.task, c = cat(t.cat);
  if (opts.chip){
    return `<div class="chip who-${i.who} ${i.done ? 'done' : ''}" data-key="${esc(i.key)}">
      <button class="check" data-action="toggle" aria-label="erledigt">${ICON_CHECK}</button>
      <div class="item-body" data-action="open">${i.movedFrom ? '↷ ' : ''}${t.kind === 'think' ? '🧠 ' : ''}${c.icon} ${esc(t.title)}</div></div>`;
  }
  const meta = [`${c.icon} ${c.name}`];
  if (t.kind === 'think') meta.push('🧠 Denkarbeit');
  if (t.mins) meta.push(`⏱ ${t.mins} min`);
  if (opts.showDate) meta.push(`📆 ${fmtShort(i.date)}`);
  meta.push(`↻ ${freqText(t)}`);
  if (i.overridden) meta.push('⇄ getauscht');
  if (i.movedFrom) meta.push(`↷ verschoben von ${fmt(i.movedFrom, {weekday:'short', day:'numeric', month:'numeric'})}`);
  return `<div class="item who-${i.who} ${i.done ? 'done' : ''}" data-key="${esc(i.key)}">
    <button class="check" data-action="toggle" aria-label="erledigt">${ICON_CHECK}</button>
    <div class="item-body" data-action="open">
      <div class="item-title">${esc(t.title)}</div>
      ${t.desc ? `<div class="item-desc">${esc(t.desc)}</div>` : ''}
      <div class="item-meta">${meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>
    </div>
    <div class="avatar" title="${esc(whoName(i.who))}">${esc(initials(i.who))}</div>
  </div>`;
}

function listHTML(arr, emptyText, opts){
  if (!arr.length) return emptyText ? `<div class="empty">${emptyText}</div>` : '';
  return `<div class="list">${sortInsts(arr).map(i => itemHTML(i, opts)).join('')}</div>`;
}

function ringHTML(k, list){
  const mine = list.filter(i => i.who === k || i.who === 'both');
  const done = mine.filter(i => i.done).length, total = mine.length;
  const r = 24, C = 2 * Math.PI * r, p = total ? done / total : 0;
  return `<div class="ring">
    <svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--card2)" stroke-width="7"/>
    <circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--${k})" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*p} ${C}"/></svg>
    <div class="txt"><b>${esc(P(k).name)}</b><span>${done} von ${total} erledigt</span></div></div>`;
}

/* ---------- Tagesansicht ---------- */
function renderDay(v){
  const d = ui.cursor, td = today();
  const all = dayInsts(d);
  const weekFlex = weekFlexInsts(monday(d));
  const monthFlex = monthFlexInsts(d);
  const overdue = d === td ? overdueInsts() : [];
  const list = all.filter(matchesFilter);
  const open = list.filter(i => !i.done).length;
  const greeting = d !== td ? fmtLong(d) : (h => h < 11 ? 'Guten Morgen ☀️' : h < 17 ? 'Hallo zusammen 👋' : 'Guten Abend 🌙')(new Date().getHours());
  const sub = !list.length ? 'Nichts geplant – genießt den Tag.' : open ? `${open} ${open === 1 ? 'Aufgabe ist' : 'Aufgaben sind'} noch offen.` : 'Alles erledigt – stark! 🎉';

  const dueLogs = d === td ? healthDue(14) : [];

  v.innerHTML = `
    <div class="card hero">
      <div><h2>${esc(greeting)}</h2><p>${d === td ? esc(fmtLong(d)) + ' · ' : ''}${sub}</p></div>
      <div class="rings">${ringHTML('a', all)}${ringHTML('b', all)}</div>
    </div>
    ${pauseBannerHTML(d)}${d === td ? requestsHTML() : ''}
    <div class="cols2">
      <div>
        ${overdue.filter(matchesFilter).length ? `<div class="section warn"><h3>Überfällig</h3></div>${listHTML(overdue.filter(matchesFilter), '', {showDate:true})}` : ''}
        <div class="section"><h3>${d === td ? 'Heute' : 'An diesem Tag'}</h3><span class="count">${list.length}</span></div>
        ${listHTML(list, '<span class="big">🌿</span>Für diesen Tag steht nichts an.')}
      </div>
      <div>
        ${dueLogs.length ? `<div class="section"><h3>🩺 Logbuch · bald fällig</h3><span class="count">${dueLogs.length}</span></div>
          <div class="list">${dueLogs.map(([id, h]) => logRowHTML(id, h)).join('')}</div>` : ''}
        <div class="section"><h3>Diese Woche · flexibel</h3><span class="count">${weekFlex.filter(matchesFilter).length}</span></div>
        ${listHTML(weekFlex.filter(matchesFilter), 'Keine flexiblen Wochenaufgaben.')}
        <div class="section"><h3>Diesen Monat · flexibel</h3><span class="count">${monthFlex.filter(matchesFilter).length}</span></div>
        ${listHTML(monthFlex.filter(matchesFilter), 'Keine flexiblen Monatsaufgaben.')}
      </div>
    </div>`;
}

/* ---------- Wochenansicht ---------- */
function renderWeek(v){
  const m = monday(ui.cursor), td = today();
  const flex = weekFlexInsts(m).filter(matchesFilter);
  let days = '';
  for (let k = 0; k < 7; k++){
    const d = addDays(m, k);
    const list = sortInsts(dayInsts(d).filter(matchesFilter));
    const open = list.filter(i => !i.done).length;
    days += `<div class="wday ${d === td ? 'today' : ''}">
      <div class="wday-head" data-action="goday" data-date="${d}"><b>${WD[k]} ${parse(d).getDate()}.</b><span>${list.length ? `${open} offen` : ''}</span></div>
      ${list.map(i => itemHTML(i, {chip:true})).join('')}
    </div>`;
  }
  v.innerHTML = `
    ${flex.length ? `<div class="section"><h3>Irgendwann diese Woche</h3><span class="count">${flex.length}</span></div><div class="flexrow">${sortInsts(flex).map(i => itemHTML(i, {chip:true})).join('')}</div><div class="section"><h3>Tage</h3></div>` : ''}
    <div class="week">${days}</div>`;
}

/* ---------- Monatsansicht ---------- */
function renderMonth(v){
  const D = parse(ui.cursor), td = today();
  const first = iso(new Date(D.getFullYear(), D.getMonth(), 1));
  const start = monday(first);
  const flex = monthFlexInsts(first).filter(matchesFilter);
  let cells = WD.map(w => `<div class="mhead">${w}</div>`).join('');
  for (let k = 0; k < 42; k++){
    const d = addDays(start, k);
    if (k >= 35 && parse(d).getMonth() !== D.getMonth()) break;
    const list = sortInsts(dayInsts(d).filter(matchesFilter));
    const shown = list.slice(0, 3);
    const done = list.filter(i => i.done).length;
    cells += `<div class="mcell ${parse(d).getMonth() !== D.getMonth() ? 'out' : ''} ${d === td ? 'today' : ''}" data-action="goday" data-date="${d}">
      <div class="num">${parse(d).getDate()}${list.length ? `<small>${done}/${list.length}</small>` : ''}</div>
      ${shown.map(i => `<div class="mbar who-${i.who} ${i.done ? 'done' : ''}">${esc(i.task.title)}</div>`).join('')}
      ${list.length > 3 ? `<div class="more">+ ${list.length - 3} weitere</div>` : ''}
      <div class="mdots">${list.map(i => `<span class="dot ${i.who}" style="${i.done ? 'opacity:.3' : ''}"></span>`).join('')}</div>
    </div>`;
  }
  v.innerHTML = `
    ${flex.length ? `<div class="section"><h3>Irgendwann diesen Monat</h3><span class="count">${flex.length}</span></div><div class="flexrow">${sortInsts(flex).map(i => itemHTML(i, {chip:true})).join('')}</div><div class="section"><h3>Kalender</h3></div>` : ''}
    <div class="month">${cells}</div>`;
}

/* ---------- Aufgabenverwaltung ---------- */
function currentTasks(){
  const td = today();
  // je Serie nur die neueste Version zeigen – sonst bearbeitet man versehentlich die auslaufende
  return latestPerSeries(state.tasks.filter(t => !t.end || t.end >= td))
    .filter(t => !(t.freq.type === 'once' && t.freq.date < td && state.done[`${t.sid}|${t.freq.date}`]));
}
function renderTasks(v){
  const tasks = currentTasks().filter(t => ui.filter === 'all' || t.assignee === ui.filter || t.assignee === 'both' || t.assignee === 'alt');
  const count = k => currentTasks().filter(t => t.assignee === k).length;
  const groups = [
    ['Täglich & werktags', ['daily','weekdays']],
    ['Wöchentlich', ['weekly','weekflex']],
    ['Monatlich', ['monthly','monthflex']],
    ['Jährlich', ['yearly']],
    ['Einmalig', ['once']],
  ];
  const row = t => {
    const c = cat(t.cat), cls = t.assignee === 'alt' ? 'both' : t.assignee;
    const future = t.start > today() ? `<span class="badge">ab ${fmtShort(t.start)}</span>` : '';
    return `<div class="trow who-${cls}" data-action="edit" data-id="${t.id}">
      <div class="ic">${c.icon}</div>
      <div class="main"><div class="item-title">${esc(t.title)}</div>
        ${t.desc ? `<div class="item-desc">${esc(t.desc)}</div>` : ''}
        <div class="item-meta"><span>↻ ${esc(freqText(t))}</span>${t.mins ? `<span>⏱ ${t.mins} min</span>` : ''}${t.kind === 'think' ? '<span>🧠 Denkarbeit</span>' : ''}</div></div>
      ${future}<span class="badge"><span class="dot ${cls}"></span>${esc(whoName(t.assignee))}</span>
    </div>`;
  };
  v.innerHTML = `
    <div class="summary">
      <div class="card"><span class="dot a" style="width:14px;height:14px"></span><div><div class="num">${count('a')}</div><small>${esc(P('a').name)}</small></div></div>
      <div class="card"><span class="dot b" style="width:14px;height:14px"></span><div><div class="num">${count('b')}</div><small>${esc(P('b').name)}</small></div></div>
      <div class="card"><span class="dot both" style="width:14px;height:14px"></span><div><div class="num">${count('both') + count('alt')}</div><small>Gemeinsam / abwechselnd</small></div></div>
    </div>
    ${pausesHTML()}
    ${tasks.length ? groups.map(([name, types]) => {
      const g = tasks.filter(t => types.includes(t.freq.type)).sort((x,y) => x.title.localeCompare(y.title, 'de'));
      return g.length ? `<div class="section"><h3>${name}</h3><span class="count">${g.length}</span></div><div class="list">${g.map(row).join('')}</div>` : '';
    }).join('') : `<div class="empty" style="margin-top:20px"><span class="big">📝</span>Noch keine Aufgaben. Leg mit „Neue Aufgabe“ los.</div>`}`;
}

/* ---------- Balance (Equal Care) ---------- */
function rangeInsts(){
  const c = ui.cursor;
  let days = [], weeks = [], months = [];
  if (ui.balRange === 'week'){
    const m = monday(c);
    for (let k = 0; k < 7; k++) days.push(addDays(m, k));
    weeks = [m];
  } else {
    const D = parse(c), n = daysInMonth(D.getFullYear(), D.getMonth());
    for (let k = 1; k <= n; k++) days.push(iso(new Date(D.getFullYear(), D.getMonth(), k)));
    weeks = days.filter(d => dow(d) === 0);
    months = [days[0]];
  }
  return [...days.flatMap(dayInsts), ...weeks.flatMap(weekFlexInsts), ...months.flatMap(monthFlexInsts)];
}
function renderBalance(v){
  const insts = rangeInsts();
  const s = {a:{n:0,m:0,dn:0,dm:0,tn:0,hm:0}, b:{n:0,m:0,dn:0,dm:0,tn:0,hm:0}};
  const byCat = {};
  insts.forEach(i => {
    const m = i.task.mins || 0, think = i.task.kind === 'think';
    const ws = i.who === 'both' ? ['a','b'] : [i.who];
    ws.forEach(w => {
      s[w].n++; s[w].m += m;
      if (think) s[w].tn++; else s[w].hm += m;
      if (i.done){ s[w].dn++; s[w].dm += m; }
      byCat[i.task.cat] = byCat[i.task.cat] || {a:0, b:0};
      byCat[i.task.cat][w] += m;
    });
  });
  // Eine Verteilungs-Karte: Balken A | B plus Einschätzung
  const splitCard = (title, sub, va, vb, show, empty) => {
    const tot = va + vb, pa = tot ? Math.round(va / tot * 100) : 50, pb = 100 - pa;
    const verdict = !tot ? empty : Math.abs(pa - 50) <= 7 ? '⚖️ Ziemlich ausgeglichen – schön!'
      : `${esc(P(pa > 50 ? 'a' : 'b').name)} trägt hier gerade mehr (${Math.max(pa, pb)} %). Vielleicht etwas umverteilen?`;
    return `<div class="card" style="margin-bottom:12px">
      <div class="section" style="margin:0"><h3>${title}</h3></div>
      <p class="muted" style="margin:6px 0 0">${sub}</p>
      <div class="bal-split">
        <div class="bal-a" style="width:${pa}%">${tot && pa >= 14 ? `${esc(P('a').name)} · ${show(va)}` : ''}</div>
        <div class="bal-b" style="width:${pb}%">${tot && pb >= 14 ? `${show(vb)} · ${esc(P('b').name)}` : ''}</div>
      </div>
      <div class="verdict">${verdict}</div></div>`;
  };
  const statCard = k => `<div class="card stat who-${k}">
    <div style="display:flex;align-items:center;gap:10px"><div class="avatar">${esc(initials(k))}</div><b style="font-size:17px">${esc(P(k).name)}</b></div>
    <div class="row"><span>Aufgaben geplant</span><b>${s[k].n}</b></div>
    <div class="row"><span>davon erledigt</span><b>${s[k].dn}</b></div>
    <div class="row"><span>🧠 Denkarbeit</span><b>${s[k].tn} ${s[k].tn === 1 ? 'Sache' : 'Sachen'}</b></div>
    <div class="row"><span>🛠️ Erledigen</span><b>${fmtMins(s[k].hm)}</b></div>
    <div class="row"><span>Zeit erledigt</span><b>${fmtMins(s[k].dm)}</b></div></div>`;
  const cats = CATS.filter(c => byCat[c.id] && (byCat[c.id].a + byCat[c.id].b) > 0);
  v.innerHTML = `
    <div style="margin:4px 0 14px" class="seg-switch">
      <button class="${ui.balRange === 'week' ? 'active' : ''}" data-action="balrange" data-r="week">Woche</button>
      <button class="${ui.balRange === 'month' ? 'active' : ''}" data-action="balrange" data-r="month">Monat</button>
    </div>
    ${splitCard('🧠 Denkarbeit – im Kopf tragen', 'Wie viele Dinge jede Person im Blick behalten, planen und organisieren muss (Anzahl).',
      s.a.tn, s.b.tn, n => n, 'Noch keine Aufgaben als „Dran denken & planen“ markiert – das geht beim Bearbeiten einer Aufgabe unter „Art der Aufgabe“.')}
    ${splitCard('🛠️ Erledigen – mit den Händen', 'Geplante Zeit für alles, was getan werden muss.',
      s.a.hm, s.b.hm, fmtMins, 'Noch keine Aufgaben mit Zeitangabe in diesem Zeitraum.')}
    <div class="hint">„Beide“-Aufgaben zählen für beide voll. Abwechselnde Aufgaben zählen für die Person, die gerade dran ist. Pausierte Aufgaben zählen nicht.</div>
    <div class="stat-grid">${statCard('a')}${statCard('b')}</div>
    <div class="section"><h3>Nach Bereichen</h3></div>
    <div class="card">
      ${cats.length ? cats.map(c => {
        const x = byCat[c.id], t = x.a + x.b;
        return `<div class="catrow"><div>${c.icon} ${esc(c.name)}</div>
          <div class="catbar"><i style="width:${x.a/t*100}%;background:var(--a)"></i><i style="width:${x.b/t*100}%;background:var(--b)"></i></div>
          <div class="mins">${fmtMins(t)}</div></div>`;
      }).join('') : '<div style="color:var(--muted)">Noch keine Daten.</div>'}
    </div>`;
}

function openModal(html, onMount){
  $('#sheet').innerHTML = html;
  $('#modal').hidden = false;
  onMount && onMount($('#sheet'));
}
function closeModal(){
  if (!state.setupDone) return;
  $('#modal').hidden = true; $('#sheet').innerHTML = '';
}

function opt(name, value, label, checked, cls = '', type = 'radio'){
  return `<label class="opt ${cls}"><input type="${type}" name="${name}" value="${esc(value)}" ${checked ? 'checked' : ''}><span>${label}</span></label>`;
}

/* ---------- Aufgabe anlegen / bearbeiten ---------- */
let pendingInboxId = null;   // Aufgabe wird aus einem Eingang-Eintrag erstellt → Eintrag danach entfernen

      ${isEdit && task.start < td ? `<div class="hint">ℹ️ Änderungen gelten erst ab dem gewählten Datum. Vergangene Tage und Erledigt-Häkchen bleiben unverändert.</div>` : `<div class="hint">ℹ️ Neue Aufgaben wirken nur in die Zukunft – frühestens ab heute.</div>`}
      <div class="actions stack rev">
        ${isEdit ? '<button type="button" class="btn danger" data-action="delete-task">Löschen</button>' : ''}
        <button type="button" class="btn" data-action="close">Abbrechen</button>
        <button type="submit" class="btn primary">Speichern</button>
      </div>
    </form>`, sheet => {
      const form = sheet.querySelector('form');
      const sync = () => {
        const ty = form.querySelector('[name=ftype]:checked').value;
        const who = form.querySelector('[name=who]:checked').value;
        form.querySelectorAll('[data-for]').forEach(el => el.hidden = !el.dataset.for.split(' ').includes(ty));
        form.querySelector('[data-show=alt]').hidden = who !== 'alt';
        form.querySelector('.unit').textContent = ty === 'daily' ? 'Tag(e)' : ty.startsWith('week') ? 'Woche(n)' : 'Monat(e)';
      };
      form.addEventListener('change', sync);
      sync();
      form.addEventListener('submit', e => { e.preventDefault(); submitTask(form, task); });
      sheet.querySelector('[data-action=delete-task]')?.addEventListener('click', () => deleteTask(task));
      // Nur mit Maus/PC direkt ins Feld springen – auf Touch-Geräten würde sonst sofort die Tastatur aufgehen
      if (!isEdit && matchMedia('(pointer: fine)').matches) setTimeout(() => form.title.focus(), 50);
    });
}

function submitTask(form, existing){
  const td = today();
  // Falls zwischenzeitlich ein Abgleich lief: aktuelles Objekt verwenden
  if (existing) existing = state.tasks.find(t => t.id === existing.id);
  const val = n => form.querySelector(`[name=${n}]`)?.value;
  const title = form.title.value.trim();
  if (!title){ form.title.focus(); return toast('Bitte einen Titel eingeben'); }
  const type = form.querySelector('[name=ftype]:checked').value;
  const freq = {type, every: Math.max(1, parseInt(val('every')) || 1)};
  if (type === 'weekly'){
    freq.days = [...form.querySelectorAll('[name=days]:checked')].map(x => +x.value);
    if (!freq.days.length) return toast('Bitte mindestens einen Wochentag wählen');
  }
  if (type === 'monthly') freq.dom = Math.min(31, Math.max(1, parseInt(val('dom')) || 1));
  if (type === 'once' || type === 'yearly'){
    freq.date = val('date');
    if (!freq.date || freq.date < td) return toast('Bitte ein Datum ab heute wählen');
  }
  if (['weekdays','once','yearly'].includes(type)) freq.every = 1;
  let start = ['once','yearly'].includes(type) ? td : (val('start') || td);
  if (start < td) start = td;
  const data = {
    title, desc: form.desc.value.trim(), cat: val('cat') ? form.querySelector('[name=cat]:checked').value : 'sonstiges',
    mins: Math.max(0, parseInt(val('mins')) || 0),
    assignee: form.querySelector('[name=who]:checked').value,
    altStart: form.querySelector('[name=altStart]:checked')?.value || 'a',
    kind: form.querySelector('[name=kind]:checked')?.value === 'think' ? 'think' : 'do',
    freq,
  };

  if (!existing){
    const id = uid();
    state.tasks.push({id, sid:id, origin:start, start, end:null, created:Date.now(), ...data});
    if (pendingInboxId && state.inbox?.[pendingInboxId]) delete state.inbox[pendingInboxId];
    pendingInboxId = null;
    toast('Aufgabe angelegt');
  } else if (existing.start >= td || !Object.keys(state.done).some(k => k.startsWith(existing.sid + '|'))){
    // Noch nicht begonnen bzw. noch nie abgehakt: direkt anpassen (keine Historie zu bewahren)
    const keepStart = existing.start < td && start === td;   // Datum nicht angefasst → Rhythmus beibehalten
    const otherVersions = state.tasks.some(t => t.sid === existing.sid && t !== existing);
    if (!keepStart && (start !== existing.start || !otherVersions)) existing.origin = start;
    Object.assign(existing, data, {start: keepStart ? existing.start : start});
    toast(keepStart || start === td ? 'Gespeichert' : `Gespeichert – startet am ${fmtShort(start)}`);
  } else {
    // Bereits laufend mit Historie: alte Version endet, neue Version gilt ab "start".
    // Wurde ein späterer Start gewählt, beginnt der Rhythmus ab diesem Datum neu.
    existing.end = addDays(start, -1);
    const rhythmChanged = existing.freq.type !== freq.type || (existing.freq.every || 1) !== freq.every;
    state.tasks.push({id:uid(), sid:existing.sid, origin: rhythmChanged || start !== td ? start : existing.origin, start, end:null, created:Date.now(), ...data});
    toast(start === td ? 'Gespeichert – gilt ab heute' : `Gespeichert – gilt ab ${fmtShort(start)}`);
  }
  save(); closeModal(); render();
}

function deleteTask(task){
  const td = today();
  if (!confirm(`„${task.title}“ wirklich löschen?\nVergangene Einträge bleiben erhalten.`)) return;
  task = state.tasks.find(t => t.id === task.id);
  if (!task) return closeModal();
  if (task.start >= td) state.tasks = state.tasks.filter(t => t !== task);
  else task.end = addDays(td, -1);
  save(); closeModal(); render(); toast('Aufgabe gelöscht');
}

      ${i.movedFrom ? `<p style="margin:0 0 10px;font-size:14px">↷ Ursprünglich am <b>${esc(fmtLong(i.movedFrom))}</b></p>` : ''}

      <div class="hint" data-scope="from">Die Aufgabe wechselt ab ${esc(fmtShort(i.date < today() ? today() : i.date))} dauerhaft. Vergangene Termine bleiben unverändert.</div>

      const sync = () => {
        const sc = form.querySelector('[name=scope]:checked').value;
        form.querySelectorAll('[data-scope]').forEach(el => el.hidden = el.dataset.scope !== sc);
      };
      form.addEventListener('change', sync); sync();
      form.addEventListener('submit', e => {
        e.preventDefault();
        const w = form.querySelector('[name=ow]:checked').value;
        const sc = form.querySelector('[name=scope]:checked').value;
        if (sc === 'one') setOverride(t, i.key, origDate, w);
        else if (sc === 'range'){

          if (!until || until < i.date) return toast('Bitte ein gültiges Enddatum wählen');

        } else handoverFrom(t, i.date < today() ? today() : i.date, w);
        save(); closeModal(); render();

      sheet.querySelector('#reqCancel')?.addEventListener('click', () => {

      });
      if (isDayInst){
        sheet.querySelector('#moveGo').addEventListener('click', () => moveInst(i, sheet.querySelector('#moveDate').value));
        sheet.querySelector('#moveTomorrow').addEventListener('click', () => moveInst(i, addDays(today(), 1)));
        sheet.querySelector('#moveBack')?.addEventListener('click', () => moveInst(i, origDate));

    });
}

// Einzelnen Termin auf einen anderen Tag legen; zurück auf den Ursprungstag hebt die Verschiebung auf
function moveInst(i, to){
  if (!to || (to < today() && to !== (i.movedFrom || i.date))) return toast('Bitte einen Tag ab heute wählen');
  const from = i.movedFrom || i.date;
  state.moves = state.moves || {};
  if (to === from) delete state.moves[i.key]; else state.moves[i.key] = to;
  save(); closeModal(); render();
  toast(to === from ? 'Wieder am ursprünglichen Tag' : `Verschoben auf ${fmt(to, {weekday:'long', day:'numeric', month:'numeric'})}`);
}

/* ---------- Übergabe: einzeln, Zeitraum, dauerhaft ---------- */
function setOverride(t, key, d, w){
  delete state.overrides[key];
  if (makeInst(t, key, d).who !== w) state.overrides[key] = w;
}
function handoverRange(t, from, until, w){
  const versions = state.tasks.filter(v => v.sid === t.sid);
  const type = t.freq.type;
  for (let d = from, n = 0; d <= until && n < 731; d = addDays(d, 1), n++){
    versions.forEach(v => {
      if (DAY_TYPES.includes(type) && v.freq.type === type && occursOn(v, d)) setOverride(v, `${v.sid}|${d}`, d, w);
      if (v.freq.type === 'weekflex' && dow(d) === 0 && active(v, d, addDays(d, 6))) setOverride(v, `${v.sid}|W${d}`, d, w);
      if (v.freq.type === 'monthflex' && d.endsWith('-01') && active(v, d, d)) setOverride(v, `${v.sid}|M${d.slice(0,7)}`, d, w);
    });
  }
  // Flexible Aufgaben: auch die laufende Woche bzw. den laufenden Monat erfassen
  versions.forEach(v => {
    if (v.freq.type === 'weekflex') setOverride(v, `${v.sid}|W${monday(from)}`, monday(from), w);
    if (v.freq.type === 'monthflex') setOverride(v, `${v.sid}|M${from.slice(0,7)}`, from.slice(0,7) + '-01', w);
  });
}
function handoverFrom(t, from, w){
  const versions = state.tasks.filter(v => v.sid === t.sid);
  // Für flexible Aufgaben zählt die laufende Woche bzw. der laufende Monat bereits mit
  versions.forEach(v => {
    if (v.freq.type === 'weekflex') setOverride(v, `${v.sid}|W${monday(from)}`, monday(from), w);
    if (v.freq.type === 'monthflex') setOverride(v, `${v.sid}|M${from.slice(0,7)}`, from.slice(0,7) + '-01', w);
  });
  versions.forEach(v => {
    if (v.end && v.end < from) return;
    if (v.start >= from){ v.assignee = w; return; }
    // laufende Version teilen: bisher alt, ab "from" neu
    const next = {...JSON.parse(JSON.stringify(v)), id:uid(), start:from, assignee:w, created:Date.now()};
    v.end = addDays(from, -1);
    state.tasks.push(next);
  });
  // Einzel-Tauschs ab diesem Tag, die nun der neuen Person entsprechen, aufräumen
  Object.keys(state.overrides).forEach(k => {
    const [sid, p] = k.split('|');
    if (sid === t.sid && state.overrides[k] === w && (p.replace(/^[WM]/, '') >= from)) delete state.overrides[k];
  });
}

function toggleDone(key){
  if (state.done[key]) delete state.done[key];
  else { state.done[key] = {at: Date.now()}; }
  save(); render();
}

}

/* ---------- Kopf leeren / Eingang ---------- */
function ago(ts){
  const min = Math.round((Date.now() - (ts || 0)) / 60000);
  if (min < 2) return 'gerade eben';
  if (min < 60) return `vor ${min} Min.`;
  if (min < 24 * 60) return `vor ${Math.round(min / 60)} Std.`;
  const days = Math.round(min / 1440);
  return days === 1 ? 'gestern' : days < 14 ? `vor ${days} Tagen` : fmt(iso(new Date(ts)), {day:'numeric', month:'numeric', year:'numeric'});
}
function addThought(text){
  state.inbox = state.inbox || {};
  state.inbox[uid()] = {text, by: ui.me || '', at: Date.now()};
  save(); render(); toast('Festgehalten 💭');
}
function openThought(){
  openModal(`

      <div class="actions stack"><button type="submit" class="btn primary">Festhalten</button></div>
    </form>`, sheet => {
      const f = sheet.querySelector('form');
      setTimeout(() => f.text.focus(), 50);   // hier gewollt: man tippt 💭 ja, um sofort zu schreiben
      f.addEventListener('submit', e => {
        e.preventDefault();
        const v = f.text.value.trim();
        if (!v) return;
        closeModal(); addThought(v);
      });
    });
}
function renderInbox(v){
  const items = Object.entries(state.inbox || {}).filter(([, n]) => n).sort((x, y) => (y[1].at || 0) - (x[1].at || 0));
  v.innerHTML = `
    <form class="inbox-add" id="inboxAdd" autocomplete="off"><input name="text" maxlength="200" placeholder="💭 Was geht dir durch den Kopf?"><button class="btn primary" aria-label="Festhalten">＋</button></form>
    <p class="muted" style="margin:10px 2px 0">Schnell festhalten, ohne gleich zu entscheiden, wer es macht. Später gemeinsam verteilen: als Aufgabe anlegen oder abhaken.</p>
    <div class="section"><h3>Eingang</h3><span class="count">${items.length}</span></div>
    ${items.length ? `<div class="list">${items.map(([id, n]) => `<div class="note">
        <div class="main">${esc(n.text)}<small>${n.by && state.people[n.by] ? esc(P(n.by).name) + ' · ' : ''}${ago(n.at)}</small></div>
        <div class="acts"><button class="mini primary" data-action="inbox-task" data-id="${id}">➜ Als Aufgabe</button><button class="mini" data-action="inbox-done" data-id="${id}">✓ Erledigt</button></div>
      </div>`).join('')}</div>`
      : '<div class="empty"><span class="big">🧘</span>Kopf ist leer – alles verteilt.</div>'}`;
  v.querySelector('#inboxAdd').addEventListener('submit', e => {
    e.preventDefault();
    const text = e.target.text.value.trim();

/* ---------- Tausch-Anfrage ---------- */
let ghToken = null;   // optionaler GitHub-Schlüssel (in der Familien-Datenbank) für sofortige Push-Nachrichten
// Stößt den Versand bei GitHub an (Workflow anfrage.yml). Ohne Schlüssel übernimmt das der stündliche Lauf.
async function triggerInstantPush(){
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo = location.pathname.split('/').filter(Boolean)[0];
  if (!ghToken || !m || !repo) return false;
  try {
    const r = await fetch(`https://api.github.com/repos/${m[1]}/${repo}/actions/workflows/anfrage.yml/dispatches`, {
      method: 'POST', headers: {Authorization: 'Bearer ' + ghToken, Accept: 'application/vnd.github+json'}, body: JSON.stringify({ref: 'main'}),
    });
    return r.status === 204;
  } catch(e) { return false; }
}
function askTakeover(i, to){
  state.requests = state.requests || {};
  state.requests[uid()] = {key: i.key, sid: i.task.sid, orig: i.movedFrom || i.date, date: i.date, title: i.task.title, from: i.who, to, status: 'open', at: Date.now()};
  save(); closeModal(); render();
  triggerInstantPush().then(ok => toast(ok ? `Anfrage an ${P(to).name} gesendet 🙋` : `Anfrage gespeichert – ${P(to).name} sieht sie in der App`));
}
function answerRequest(id, ans){
  const r = state.requests?.[id];
  if (!r) return toast('Anfrage nicht gefunden');
  if (r.status !== 'open') return toast('Diese Anfrage wurde schon beantwortet');
  if (ans === 'yes'){
    const t = state.tasks.find(x => x.sid === r.sid && (DAY_TYPES.includes(x.freq.type) ? occursOn(x, r.orig) : active(x, r.orig, r.orig)))
      || state.tasks.find(x => x.sid === r.sid);
    if (t) setOverride(t, r.key, r.orig, r.to);
  }
  state.requests[id] = {...r, status: ans, answeredAt: Date.now()};
  save(); render();
  triggerInstantPush();
  toast(ans === 'yes' ? `Eingetragen: ${P(r.to).name} übernimmt ✓` : 'Abgelehnt – Bescheid geht raus');
}
function requestsHTML(){
  const now = Date.now(), yesterday = addDays(today(), -1);
  return Object.entries(state.requests || {})
    .filter(([, r]) => r && (r.status === 'open' ? r.date >= yesterday : now - (r.answeredAt || 0) < 6 * 3600e3))
    .sort((x, y) => (x[1].at || 0) - (y[1].at || 0))
    .map(([id, r]) => r.status === 'open'
      ? `<div class="req"><div class="txt">🙋 ${esc(P(r.from).name)} fragt ${esc(P(r.to).name)}: „${esc(r.title)}“ übernehmen?<small>${esc(fmtLong(r.date))}</small></div>
          <button class="btn primary" data-action="req-answer" data-id="${id}" data-a="yes">✓ Ja, übernehme ich</button>
          <button class="btn" data-action="req-answer" data-id="${id}" data-a="no">Nein</button></div>`
      : `<div class="req" style="background:color-mix(in srgb,${r.status === 'yes' ? '#10b981' : '#dc2626'} 13%,var(--card))"><div class="txt">${r.status === 'yes' ? '✅' : '❌'} ${esc(P(r.to).name)} ${r.status === 'yes' ? 'übernimmt' : 'kann leider nicht'}: „${esc(r.title)}“<small>${esc(fmtLong(r.date))}</small></div></div>`)
    .join('');
}
// Alte Anfragen nach 14 Tagen aufräumen
function cleanupRequests(){
  const limit = Date.now() - 14 * 864e5;
  const old = Object.keys(state.requests || {}).filter(id => (state.requests[id]?.at || 0) < limit);
  old.forEach(id => delete state.requests[id]);
  if (old.length) save();
}

const SUBJECTS = [
  {id:'Jorik',   icon:'🧒'},
  {id:'Pax',     icon:'🐈'},
  {id:'Rhonna',  icon:'🐈‍⬛'},
  {id:'Pferde',  icon:'🐎'},
  {id:'Familie', icon:'👨‍👩‍👦'},
];
const subjIcon = s => SUBJECTS.find(x => x.id === s)?.icon || '📋';
const fmtDate = d => fmt(d, {day:'numeric', month:'numeric', year:'numeric'});
function addInterval(d, n, unit){
  if (unit === 'w') return addDays(d, 7 * n);
  const D = parse(d), months = unit === 'y' ? 12 * n : n;
  const target = new Date(D.getFullYear(), D.getMonth() + months, 1);
  return iso(new Date(target.getFullYear(), target.getMonth(), Math.min(D.getDate(), daysInMonth(target.getFullYear(), target.getMonth()))));
}
const unitName = h => ({w: ['Woche', 'Wochen'], m: ['Monat', 'Monate'], y: ['Jahr', 'Jahre']})[h.unit || 'm'][h.every === 1 ? 0 : 1];
function dueState(h){
  if (!h.next) return 'none';
  const diff = daysBetween(today(), h.next);
  return diff < 0 ? 'over' : diff <= 30 ? 'soon' : 'ok';
}
function relDue(h){
  if (!h.next) return 'kein Termin';
  const diff = daysBetween(today(), h.next);
  if (diff < 0) return diff === -1 ? 'seit gestern fällig' : `seit ${-diff} Tagen fällig`;
  if (diff === 0) return 'heute fällig';
  if (diff === 1) return 'morgen fällig';
  if (diff < 21) return `in ${diff} Tagen`;
  if (diff < 70) return `in ${Math.round(diff / 7)} Wochen`;
  return `in ${Math.round(diff / 30.4)} Monaten`;
}
// Einträge, die in den nächsten n Tagen fällig sind (inkl. überfällige), sortiert
const healthDue = n => Object.entries(state.health || {})
  .filter(([, h]) => h && h.next && h.next <= addDays(today(), n))

}

      });
    });

function exportBackup(){

  a.href = URL.createObjectURL(blob);
  a.download = `wirzwei-backup-${today()}.json`;

  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Backup erstellt');
}
function importBackup(e){
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!data.tasks || !data.people) throw new Error();
      if (!confirm('Backup laden? Die aktuellen Daten auf diesem Gerät werden ersetzt.')) return;
      state = Object.assign(defaultState(), data, {setupDone:true});
      save(); closeModal(); render(); toast('Backup geladen');
    } catch(err){ toast('Datei konnte nicht gelesen werden'); }
  };
  r.readAsText(file);
}

/* =========================================================
   Synchronisierung über Firebase Realtime Database
   Prinzip: Jede Aufgabe, jedes Häkchen und jeder Tausch ist ein eigener
   Eintrag in der Cloud. Geändert werden nur die Einträge, die sich
   gegenüber dem letzten bekannten Cloud-Stand ("base") geändert haben –
   so können Tablet und Handys gleichzeitig arbeiten, auch offline.
   ========================================================= */
const SYNCKEY = 'wirzwei.sync', BASEKEY = 'wirzwei.base', DIRTYKEY = 'wirzwei.dirty';
const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const QR_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e) { return d; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };

let sync  = lsGet(SYNCKEY, null);   // {config, family}
let base  = lsGet(BASEKEY, null);   // letzter Cloud-Stand (flach); null = Cloud komplett übernehmen
let dirty = lsGet(DIRTYKEY, {});    // gesendete, aber noch nicht bestätigte Pfade
let fbApp = null, famRef = null, syncStatus = sync ? 'connecting' : 'off', syncError = '', pushSeq = 0;

const normPeople = p => ({
  a: {name: String(p?.a?.name || 'Person 1'), color: p?.a?.color || '#6366f1'},
  b: {name: String(p?.b?.name || 'Person 2'), color: p?.b?.color || '#f97316'},
});
const normTask = t => ({
  id:t.id, sid:t.sid || t.id, origin:t.origin || t.start, start:t.start, end:t.end || null, created:t.created || 0,
  title:t.title || '', desc:t.desc || '', cat:t.cat || 'sonstiges', mins:t.mins || 0,
  assignee:t.assignee || 'a', altStart:t.altStart || 'a', kind:t.kind === 'think' ? 'think' : 'do',
  freq:{type:t.freq.type, every:t.freq.every || 1, days:[...(t.freq.days || [])], dom:t.freq.dom || 1, date:t.freq.date || ''},
});
// Frei strukturierte Sammlungen (je Eintrag ein Pfad in der Cloud)
const EXTRA = ['pauses', 'inbox', 'requests', 'health'];
// Stabile Schreibweise wie Firebase sie zurückliefert: Schlüssel sortiert, leere Werte/Listen entfernt
function canon(v){
  if (Array.isArray(v)){ const a = v.map(canon).filter(x => x !== undefined); return a.length ? a : undefined; }
  if (v && typeof v === 'object'){
    const o = {};
    Object.keys(v).sort().forEach(k => { const c = canon(v[k]); if (c !== undefined) o[k] = c; });
    return Object.keys(o).length ? o : undefined;
  }
  return v === null || v === undefined ? undefined : v;
}
function flatten(s){
  const m = {people: JSON.stringify(normPeople(s.people))};
  s.tasks.forEach(t => m['tasks/' + t.id] = JSON.stringify(normTask(t)));
  for (const k in s.done) m['done/' + k] = JSON.stringify({at: s.done[k]?.at || 0});
  for (const k in s.overrides) m['overrides/' + k] = JSON.stringify(String(s.overrides[k]));
  for (const k in s.moves || {}) m['moves/' + k] = JSON.stringify(String(s.moves[k]));
  EXTRA.forEach(c => { for (const k in s[c] || {}){ const v = canon(s[c][k]); if (v !== undefined) m[c + '/' + k] = JSON.stringify(v); } });
  return m;
}
function unflatten(m){
  const s = {people: normPeople(null), tasks: [], done: {}, overrides: {}, moves: {}};
  EXTRA.forEach(c => s[c] = {});
  for (const [p, v] of Object.entries(m)){
    const val = JSON.parse(v), i = p.indexOf('/'), sec = i < 0 ? p : p.slice(0, i), k = p.slice(i + 1);
    if (p === 'people') s.people = val;
    else if (sec === 'tasks') s.tasks.push(val);
    else if (sec === 'done') s.done[k] = val;
    else if (sec === 'overrides') s.overrides[k] = val;
    else if (sec === 'moves') s.moves[k] = val;
    else if (EXTRA.includes(sec)) s[sec][k] = val;
  }
  s.tasks.sort((x, y) => x.created - y.created);
  return s;
}
const remoteFlat = val => flatten({
  people: val?.people,
  tasks: Object.values(val?.tasks || {}).filter(t => t && t.freq).map(normTask),
  done: val?.done || {}, overrides: val?.overrides || {}, moves: val?.moves || {},
  ...Object.fromEntries(EXTRA.map(c => [c, val?.[c] || {}])),
});
function diffFlat(b, c){
  const out = {};
  for (const p in c) if (b[p] !== c[p]) out[p] = c[p];
  for (const p in b) if (!(p in c)) out[p] = null;
  return out;
}

function onRemote(snap){
  const remote = remoteFlat(snap.val());
  const merged = {...remote}, toPush = {};
  if (base){
    const local = flatten(state);
    const pending = diffFlat(base, local);
    for (const k in dirty) if (!(k in pending)) pending[k] = k in local ? local[k] : null;
    for (const [p, v] of Object.entries(pending)){
      if (v === null) delete merged[p]; else merged[p] = v;
      if ((remote[p] ?? null) !== v) toPush[p] = v;
    }
  } else { dirty = {}; lsSet(DIRTYKEY, dirty); }
  base = remote; lsSet(BASEKEY, base);
  Object.assign(state, unflatten(merged), {setupDone: true});
  saveLocal();
  if (Object.keys(toPush).length) pushPaths(toPush);
  render();
  handlePendingAnswer();
}
function pushPaths(p){
  if (!famRef) return;
  const obj = {}, mine = {};
  for (const [k, v] of Object.entries(p)){
    obj[k] = v === null ? null : JSON.parse(v);
    mine[k] = dirty[k] = `${Date.now()}-${++pushSeq}`;
  }
  lsSet(DIRTYKEY, dirty);
  famRef.update(obj).then(() => {
    for (const k in mine) if (dirty[k] === mine[k]) delete dirty[k];
    lsSet(DIRTYKEY, dirty);
  }).catch(e => setStatus('error', e.message));
}
function pushSync(){
  if (!famRef || !base) return;
  const p = diffFlat(base, flatten(state));
  if (Object.keys(p).length) pushPaths(p);
}

function loadScript(src){
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => { s.remove(); rej(new Error('Skript konnte nicht geladen werden (offline?)')); };
    document.head.appendChild(s);
  });
}
async function startSync(){
  if (!sync || famRef) return;
  setStatus('connecting');
  try {
    for (const f of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-database-compat.js']) await loadScript(FB_SDK + f);
    fbApp = firebase.apps.find(a => a.name === 'wirzwei') || firebase.initializeApp(sync.config, 'wirzwei');
    const auth = fbApp.auth();
    const user = await new Promise(r => { const off = auth.onAuthStateChanged(u => { off(); r(u); }); });
    if (!user) await auth.signInAnonymously();
    const db = fbApp.database();
    db.ref('.info/connected').on('value', s => { if (syncStatus !== 'error') setStatus(s.val() ? 'online' : 'offline'); });
    famRef = db.ref('families/' + sync.family);
    famRef.child('settings/ghToken').on('value', s => { ghToken = s.val() || null; const r = $('#reqSection'); if (r) r.innerHTML = reqSectionHTML(); });
    famRef.on('value', onRemote, e => { famRef = null; setStatus('error', 'Zugriff verweigert. Sind die Datenbank-Regeln aus der Anleitung veröffentlicht? (' + e.message + ')'); });
  } catch(e){
    famRef = null;
    const msg = String(e.message || e);
    if (/admin-restricted|operation-not-allowed/.test(msg)) setStatus('error', 'Anonyme Anmeldung ist in Firebase nicht aktiviert (Anleitung Schritt 4).');
    else setStatus(navigator.onLine ? 'error' : 'offline', msg);
  }
}
function stopSync(){
  if (pushCfg.on){
    try { famRef && famRef.child('push/' + deviceId()).remove(); } catch(e) {}
    pushCfg.on = false; lsSet(PUSHKEY, pushCfg);
  }
  try { famRef && famRef.off(); } catch(e) {}
  try { fbApp && fbApp.delete(); } catch(e) {}
  famRef = null; fbApp = null; sync = null; base = null; dirty = {};
  lsSet(SYNCKEY, null); lsSet(BASEKEY, null); lsSet(DIRTYKEY, null);
  setStatus('off');
}
function connect(config, family, asNew){
  stopSync();
  sync = {config, family};
  base = asNew ? {} : null;   // neu: alles hochladen · beitreten: Cloud übernehmen
  lsSet(SYNCKEY, sync); lsSet(BASEKEY, base);
  startSync();
}
window.addEventListener('online', () => { if (sync && !famRef) startSync(); });

function setStatus(s, err = ''){
  syncStatus = s; syncError = s === 'error' ? err : '';
  const ind = $('#syncInd');
  ind.hidden = s === 'off';
  ind.querySelector('.sdot').className = 'sdot ' + s;
  ind.title = statusText();
  const sec = $('#syncSection'); if (sec) sec.innerHTML = syncSectionHTML();
  refreshPushSection();
  const rs = $('#reqSection'); if (rs) rs.innerHTML = reqSectionHTML();
}
function statusText(){
  return ({online:'Verbunden – alles wird automatisch abgeglichen', offline:'Offline – Änderungen werden später übertragen',
    connecting:'Verbinde …', error:'Verbindungsproblem', off:'Nicht verbunden'})[syncStatus];
}
function syncSectionHTML(){
  const head = '<div class="section"><h3>Geräte verbinden</h3></div>';

    <p class="muted">Gleicht Aufgaben, Häkchen und Tausche zwischen Tablet und Handys ab – über eure eigene, kostenlose Firebase-Datenbank. Wie das eingerichtet wird, steht in der Anleitung.</p>
    <div class="actions start">
      <button class="btn" data-action="sync-create">☁️ Neue Familie anlegen</button>

    <div class="actions start">

      <button class="btn" data-action="sync-leave">Verbindung trennen</button>

}

function parseConfig(text){
  const c = {};
  text.replace(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g, (_, k, v) => { c[k] = v; });
  if (!c.apiKey || !c.projectId) return {error:'Das sieht nicht nach einer Firebase-Konfiguration aus (apiKey/projectId fehlen).'};
  if (!c.databaseURL) return {error:'In der Konfiguration fehlt „databaseURL“. Bitte zuerst die Realtime Database anlegen (Schritt 2) und die Konfiguration danach erneut kopieren.'};
  return {config:{apiKey:c.apiKey, authDomain:c.authDomain || `${c.projectId}.firebaseapp.com`, databaseURL:c.databaseURL, projectId:c.projectId, appId:c.appId || ''}};
}
function newFamilyKey(){
  const chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = new Uint32Array(32);
  crypto.getRandomValues(r);
  return [...r].map(x => chars[x % chars.length]).join('');
}
const encodeCode = () => btoa(unescape(encodeURIComponent(JSON.stringify({c:sync.config, f:sync.family})))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function decodeCode(code){
  try {
    const s = code.trim().replace(/^.*join=/, '').replace(/-/g,'+').replace(/_/g,'/');
    const d = JSON.parse(decodeURIComponent(escape(atob(s))));
    return d.c && d.c.databaseURL && d.f && d.f.length >= 24 ? d : null;
  } catch(e) { return null; }
}

           : `<div class="hint">Die App läuft gerade als lokale Datei. Für den QR-Code bitte die App über ihre Webadresse öffnen (Anleitung, Teil 2). Der Code unten funktioniert trotzdem.</div>`}

        sheet.querySelector('#qr').innerHTML = q.createSvgTag({cellSize:4, margin:0, scalable:true});
