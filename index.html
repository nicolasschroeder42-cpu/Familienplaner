function checkJoinLink(){
  const m = location.hash.match(/join=([\w-]+)/);
  if (!m) return false;
  history.replaceState(null, '', location.pathname + location.search);
  const d = decodeCode(m[1]);
  if (!d){ toast('Ungültiger Verbindungslink'); return false; }
  if (sync && sync.family === d.f){ toast('Dieses Gerät ist bereits verbunden'); return true; }
  if (!confirm('Dieses Gerät mit eurem Familienplaner verbinden?\nAufgaben auf diesem Gerät werden durch die gemeinsamen ersetzt.')) return false;
  joinFamily(d);
  return true;
}

/* =========================================================
   Morgen-Benachrichtigung (Web Push)
   Das Gerät meldet sich in der Familien-Datenbank unter push/<Geräte-ID> an.
   Verschickt wird stündlich von GitHub Actions (push-senden.js).
   ========================================================= */
const PUSHKEY = 'wirzwei.push';
let pushCfg = lsGet(PUSHKEY, {on:false, person:'a', hour:9});
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && location.protocol === 'https:';
function deviceId(){
  let id = lsGet('wirzwei.device', null);
  if (!id){ id = uid() + uid(); lsSet('wirzwei.device', id); }
  return id;
}
const b64uToBytes = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));

function pushSectionHTML(){
  const head = '<div class="section"><h3>Morgens benachrichtigen</h3></div>';
  if (!pushSupported()) return head + '<p class="muted">Benachrichtigungen gehen nur, wenn die App über ihre Webadresse (https) in Chrome läuft bzw. von dort installiert wurde.</p>';
  if (!sync) return head + '<p class="muted">Bitte zuerst oben „Geräte verbinden“ einrichten – die Nachrichten laufen über eure Familien-Datenbank.</p>';
  const c = pushCfg, hours = Array.from({length:18}, (_, i) => i + 5);
  return head + `
    <p class="muted">Jeden Morgen eine Nachricht auf dieses Gerät, was heute ansteht.</p>
    <div class="row2">
      <div class="field" style="margin:0"><span>Aufgaben von</span><div class="opts">${['a','b'].map(k => opt('pushWho', k, esc(P(k).name), c.person === k)).join('')}</div></div>
      <label class="field" style="margin:0"><span>Uhrzeit</span><select id="pushHour">${hours.map(h => `<option value="${h}" ${c.hour === h ? 'selected' : ''}>${pad(h)}:00 Uhr</option>`).join('')}</select></label>
    </div>
    <div class="syncbox" style="margin-top:14px"><span class="sdot ${c.on ? 'online' : ''}"></span>${c.on ? `Aktiv – täglich gegen ${pad(c.hour)}:00 Uhr für ${esc(P(c.person).name)}` : 'Ausgeschaltet'}</div>
    <div class="actions start">
      ${c.on ? '<button class="btn" data-action="push-save">Änderung speichern</button><button class="btn" data-action="push-off">Ausschalten</button>'
             : '<button class="btn primary" data-action="push-on">🔔 Einschalten</button>'}
      <button class="btn" data-action="push-test">Vorschau anzeigen</button>
    </div>`;
}
function refreshPushSection(){ const s = $('#pushSection'); if (s) s.innerHTML = pushSectionHTML(); }
const pushForm = () => ({
  person: document.querySelector('[name=pushWho]:checked')?.value || pushCfg.person,
  hour: +(document.querySelector('#pushHour')?.value || pushCfg.hour),
});

async function askPermission(){
  const perm = await Notification.requestPermission();
  if (perm !== 'granted'){ toast('Benachrichtigungen sind für die App nicht erlaubt (Android-Einstellungen prüfen)'); return false; }
  return true;
}
async function pushEnable(){
  const {person, hour} = pushForm();
  if (!famRef) return toast('Gerade keine Verbindung zur Datenbank – bitte gleich nochmal versuchen');
  if (!await askPermission()) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uToBytes(VAPID_PUBLIC)});
    await famRef.child('push/' + deviceId()).update({sub: sub.toJSON(), person, hour, updated: Date.now()});
    pushCfg = {on:true, person, hour}; lsSet(PUSHKEY, pushCfg);
    refreshPushSection();
    toast(`Eingeschaltet – täglich gegen ${pad(hour)}:00 Uhr`);
  } catch(e){ toast('Einschalten fehlgeschlagen: ' + e.message); }
}
async function pushDisable(){
  try { const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch(e) {}
  try { famRef && await famRef.child('push/' + deviceId()).remove(); } catch(e) {}
  pushCfg.on = false; lsSet(PUSHKEY, pushCfg);
  refreshPushSection(); toast('Benachrichtigung ausgeschaltet');
}
async function pushTest(){
  if (!await askPermission()) return;
  const msg = buildDigest(pushForm().person, today()) || {title: '🏖️ Pause', body: 'Heute ist alles pausiert – an solchen Tagen kommt keine Morgen-Nachricht.'};
  (await navigator.serviceWorker.ready).showNotification(msg.title, {body:msg.body, icon:'icon-192.png', badge:'badge-96.png', tag:'daily', data:{url:'./?view=day'}});
}

function reqSectionHTML(){
  if (!sync) return '';
  const onPages = /\.github\.io$/.test(location.hostname);
  return `<div class="section"><h3>🙋 Tausch-Anfragen sofort zustellen</h3></div>
    <p class="muted">Optional. Ohne Schlüssel erscheinen Anfragen sofort in der geöffneten App und als Push-Nachricht spätestens mit dem nächsten stündlichen Lauf. Mit GitHub-Schlüssel kommt die Nachricht nach etwa einer Minute (Anleitung, Teil 6). Der Schlüssel gilt für alle verbundenen Geräte.</p>
    <div class="syncbox"><span class="sdot ${ghToken ? 'online' : ''}"></span>${ghToken ? 'Schlüssel eingerichtet' : 'Kein Schlüssel hinterlegt'}${onPages ? '' : ' · funktioniert nur in der App unter github.io'}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <input type="password" id="ghTok" placeholder="${ghToken ? 'Neuen Schlüssel einfügen …' : 'github_pat_…'}" autocomplete="off" style="flex:1;min-width:200px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)">
      <button class="btn" data-action="gh-save">Speichern</button>
    </div>`;
}

// Antwort direkt aus der Push-Nachricht ("Ja"/"Nein"): ?req=<id>&answer=yes|no
let pendingAnswer = null;
function handlePendingAnswer(){
  if (!pendingAnswer || !state.requests?.[pendingAnswer.id]) return;   // ggf. erst nach dem Abgleich vorhanden
  const p = pendingAnswer; pendingAnswer = null;
  if (p.answer === 'yes' || p.answer === 'no') answerRequest(p.id, p.answer);
}

/* =========================================================
   Start
   ========================================================= */
// Aus einer Benachrichtigung geöffnet → passende Ansicht bzw. Antwort auf eine Tausch-Anfrage
const qp = new URLSearchParams(location.search);
if (VIEWS[qp.get('view')]){ ui.view = qp.get('view'); saveUI(); }
if (qp.get('req')){ pendingAnswer = {id: qp.get('req'), answer: qp.get('answer')}; ui.view = 'day'; }
if (location.search) history.replaceState(null, '', location.pathname + location.hash);
if (!storageOK) showBanner('Dieser Browser erlaubt kein dauerhaftes Speichern (privater Modus?). Änderungen gehen beim Schließen verloren.');
cleanupRequests();
render();
handlePendingAnswer();
keepAwake();
setStatus(syncStatus);
const joined = checkJoinLink();
if (!state.setupDone && !joined) openSettings(true);
if (sync) startSync();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
